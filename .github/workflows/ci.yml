name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy app
      - name: Tests (pytest)
        run: pytest
        env:
          # Testes usam SQLite in-memory (conftest.py) — sem serviço Postgres.
          # As vars existem apenas para o Settings obrigatório do app importar.
          DATABASE_URL: sqlite+aiosqlite://
          GATEWAY_URL: http://localhost:8000
          GATEWAY_API_KEY: ci-test-key
          JUDGE_MODEL: deepseek/deepseek-chat

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build (tsc + vite)
        run: npm run build

  docker-build:
    # Sem isso, um Dockerfile quebrado (ex: package instalado vazio por
    # ordem errada de COPY/RUN) só é descoberto rodando `docker compose up`
    # manualmente — já aconteceu uma vez.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build ./backend
      - name: Build frontend image
        run: docker build ./frontend
