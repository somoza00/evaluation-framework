name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: o GITHUB_TOKEN deste workflow herda o default da organização
# (que pode ser leitura/escrita em contents). A CI só faz checkout e roda
# lint/types/testes/scan — nada escreve no repositório, publica pacote ou cria
# release. Sem este bloco, um passo comprometido (uma action de terceiro, um
# `npm ci` com postinstall malicioso) teria o token com permissão de escrita
# para commitar/pushar na main. Mesmo bloco já usado no CI do
# study-memory-agent. Os jobs que PRECISAM de mais (o CD, com id-token: write
# para o Workload Identity Federation) declaram as próprias permissões no
# job — workflow_run não herda este bloco.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy app
      - name: Tests (pytest)
        run: pytest
        env:
          # Testes usam SQLite in-memory (conftest.py) — sem serviço Postgres.
          # As vars existem apenas para o Settings obrigatório do app importar.
          DATABASE_URL: sqlite+aiosqlite://
          GATEWAY_URL: http://localhost:8000
          GATEWAY_API_KEY: ci-test-key
          JUDGE_MODEL: deepseek/deepseek-chat

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # vite 8 exige node ^20.19 || >=22.12; 24 é LTS atual — cobre com folga.
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build

  docker-build:
    # Sem isso, um Dockerfile quebrado (ex: package instalado vazio por
    # ordem errada de COPY/RUN) só é descoberto rodando `docker compose up`
    # manualmente — já aconteceu uma vez.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t eval-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t eval-frontend:ci ./frontend
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: eval-backend:ci
          severity: CRITICAL,HIGH
          # Informativo por enquanto (CVE de imagem base costuma não ter fix
          # imediato); promover pra exit-code 1 quando o time decidir gatear.
          exit-code: "0"
      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: eval-frontend:ci
          severity: CRITICAL,HIGH
          exit-code: "0"

  dependency-audit:
    # pip-audit checa CVE conhecida nas deps Python resolvidas — diferente
    # do Trivy (que olha a imagem), isso é acionável na hora (só editar o
    # range no pyproject.toml), então aqui sim quebra o build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: pip-audit
        # --skip-editable: o próprio pacote local (instalado com pip install
        # -e) não existe no PyPI pra ser auditado — sem isso, pip-audit trata
        # isso como falha em vez de simplesmente pular o pacote local.
        run: pip install "pip-audit>=2.7.0" "setuptools>=83.0.0" && pip-audit --skip-editable

  migrations:
    # As migrations só eram exercitadas no startup do container (entrypoint:
    # `alembic upgrade head`). Um erro de revision (ordem, DDL inválido,
    # downgrade quebrado) passava por lint/types/testes — que criam o schema com
    # create_all/metadata — e só aparecia no deploy do Cloud Run, com o serviço
    # fora do ar. Aqui as migrations são aplicadas E desfeitas contra um Postgres
    # real: elas usam JSONB, então SQLite (usado no job de testes) não serve.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eval
          POSTGRES_PASSWORD: eval
          POSTGRES_DB: evaluation
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://eval:eval@localhost:5432/evaluation
      # Obrigatórias pelo Settings (importado pelo migrations/env.py), mesmo a
      # migration não usando o gateway.
      GATEWAY_URL: http://localhost:8000
      GATEWAY_API_KEY: ci-test-key
      JUDGE_MODEL: deepseek/deepseek-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade to base
        run: alembic downgrade base