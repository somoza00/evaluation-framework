services:
  db:
    # Sobe sozinho depois de um crash ou reboot do Docker (produção): sem
    # restart explícito, um container que cai deixa o stack parado.
    restart: unless-stopped
    # Pinado por digest (não "postgres:16" flutuante) — ver .github/dependabot.yml.
    image: postgres:16@sha256:11a9d238fbb48bab14599c57e41123254452b1a2d93c6c8595bce96f346bd082
    environment:
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: eval
      POSTGRES_DB: evaluation
    ports:
      # 5434 no host (não 5433): o stack irmão myown-llm-gateway publica o
      # Postgres DELE na 5433 do host, e os dois rodam juntos — o gateway é o
      # judge LLM (GATEWAY_URL=http://host.docker.internal:8000). Na 5433 este
      # container nem subia: "Bind for 0.0.0.0:5433 failed: port is already
      # allocated". Sobrescreva com EVAL_DB_PORT no .env se precisar.
      #
      # 127.0.0.1: o Postgres usa credencial de dev fixa (eval/eval) e não tem
      # TLS. Publicado em 0.0.0.0 ele ficava alcançável por qualquer máquina
      # da rede local (o host é um laptop que troca de WiFi) — com uma senha
      # que está no próprio README. Os stacks irmãos já publicam as
      # dependências deles só no loopback (gateway: 5433/6379; study: 6333);
      # aqui a regra não valia para o banco. O backend fala com `db:5432` pela
      # rede interna, então o publish só serve a ferramentas locais — psql,
      # alembic, `make migrate-smoke` — e `localhost:5434` continua igual.
      - "127.0.0.1:${EVAL_DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval -d evaluation"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eval-net

  backend:
    restart: unless-stopped
    build: ./backend
    env_file:
      # Obrigatório no compose 2.24+; sobe com defaults se o .env não existir.
      - path: .env
        required: false
    environment:
      # environment sobrescreve o .env: dentro da rede, o banco é o serviço db.
      DATABASE_URL: postgresql+asyncpg://eval:eval@db:5432/evaluation
      GATEWAY_URL: http://host.docker.internal:8000
      # Sem default: um fallback silencioso (ex: "sk-local") sobe o
      # container com uma chave placeholder sem avisar ninguém. Defina
      # GATEWAY_API_KEY no .env (raiz) — ver .env.example.
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?defina GATEWAY_API_KEY no .env (raiz) — ver .env.example}
      JUDGE_MODEL: ${JUDGE_MODEL:-deepseek/deepseek-chat}
    ports:
      # 8001 no host, sobrescrevível por EVAL_BACKEND_PORT: o stack irmão
      # study-memory-agent publica a MESMA 8001 (e a 5174 no frontend) — rodar
      # os dois juntos dava "Bind for 0.0.0.0:8001 failed: port is already
      # allocated", o mesmo problema que motivou a 5434 do Postgres abaixo.
      # Com a variável basta `EVAL_BACKEND_PORT=8002 docker compose up -d`.
      - "${EVAL_BACKEND_PORT:-8001}:8001"
    healthcheck:
      # A imagem já define HEALTHCHECK (ver backend/Dockerfile); repetido
      # aqui só para deixar o intervalo explícito e óbvio no compose.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      # Permite o container alcançar o myown-llm-gateway rodando no host (porta 8000).
      - "host.docker.internal:host-gateway"
    networks:
      - eval-net

  frontend:
    restart: unless-stopped
    build: ./frontend
    env_file:
      - path: .env
        required: false
    environment:
      # Proxy do Vite aponta para o backend dentro da rede do compose.
      VITE_PROXY_TARGET: http://backend:8001
    ports:
      # 5174 no host, sobrescrevível por EVAL_FRONTEND_PORT — mesma colisão do
      # backend acima (o study-memory-agent também publica 5174). Ao trocar,
      # acrescente a nova origem em CORS_ORIGINS, senão o browser bloqueia.
      - "${EVAL_FRONTEND_PORT:-5174}:5174"
    healthcheck:
      # O frontend não tinha healthcheck; usa o próprio node (fetch global,
      # sem depender de curl). Se o Vite não responder, fica "unhealthy".
      test: ["CMD", "node", "-e", "fetch('http://localhost:5174').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - eval-net

volumes:
  pgdata:

networks:
  eval-net:
    driver: bridge
