services:
  db:
    # Pinado por digest (não "postgres:16" flutuante) — ver .github/dependabot.yml.
    image: postgres:16@sha256:11a9d238fbb48bab14599c57e41123254452b1a2d93c6c8595bce96f346bd082
    environment:
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: eval
      POSTGRES_DB: evaluation
    ports:
      # 5433 no host para não conflitar com Postgres locais (ex: stack Argos)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval -d evaluation"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eval-net

  backend:
    build: ./backend
    env_file:
      # Obrigatório no compose 2.24+; sobe com defaults se o .env não existir.
      - path: .env
        required: false
    environment:
      # environment sobrescreve o .env: dentro da rede, o banco é o serviço db.
      DATABASE_URL: postgresql+asyncpg://eval:eval@db:5432/evaluation
      GATEWAY_URL: http://host.docker.internal:8000
      # Sem default: um fallback silencioso (ex: "sk-local") sobe o
      # container com uma chave placeholder sem avisar ninguém. Defina
      # GATEWAY_API_KEY no .env (raiz) — ver .env.example.
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?defina GATEWAY_API_KEY no .env (raiz) — ver .env.example}
      JUDGE_MODEL: ${JUDGE_MODEL:-deepseek/deepseek-chat}
    ports:
      - "8001:8001"
    healthcheck:
      # A imagem já define HEALTHCHECK (ver backend/Dockerfile); repetido
      # aqui só para deixar o intervalo explícito e óbvio no compose.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      # Permite o container alcançar o myown-llm-gateway rodando no host (porta 8000).
      - "host.docker.internal:host-gateway"
    networks:
      - eval-net

  frontend:
    build: ./frontend
    env_file:
      - path: .env
        required: false
    environment:
      # Proxy do Vite aponta para o backend dentro da rede do compose.
      VITE_PROXY_TARGET: http://backend:8001
    ports:
      - "5174:5174"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - eval-net

volumes:
  pgdata:

networks:
  eval-net:
    driver: bridge
